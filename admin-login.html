<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Sethupathy Government Arts College</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/3ee7079dc6.js" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg-dark: #0f172a; --bg-card: #1e293b; --accent-blue: #3b82f6; --accent-gold: #fbbf24; --text-main: #f1f5f9; --text-muted: #94a3b8; }
        body { background: var(--bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; }
        .login-container { background: var(--bg-card); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; }
        .login-header { text-align: center; margin-bottom: 32px; }
        .logo { width: 72px; height: 72px; background: linear-gradient(135deg, var(--accent-gold), #d97706); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 32px; color: white; }
        h1 { color: var(--text-main); font-size: 1.5rem; margin-bottom: 4px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; }
        .error-message { background: #ef4444; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
        .error-message.show { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: var(--text-muted); font-size: 0.875rem; font-weight: 500; margin-bottom: 8px; }
        input { width: 100%; padding: 14px 16px; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--text-main); font-size: 1rem; }
        input:focus { outline: none; border-color: var(--accent-blue); }
        .btn-login { width: 100%; padding: 14px; background: var(--accent-blue); border: none; border-radius: 10px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-login:hover { opacity: 0.9; }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: var(--text-muted); text-decoration: none; }
        .footer { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo"><i class="fas fa-shield-alt"></i></div>
            <h1>Admin Login</h1>
            <p class="subtitle">Sethupathy Government Arts College</p>
        </div>
        <div class="error-message" id="error-message"></div>
        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@sgac.edu.in" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Login to Admin
            </button>
        </form>
        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
        </div>
        <div class="footer">&copy; 2025 SGAC Admin Panel</div>
    </div>
    <script>
        const API_BASE = window.location.origin;
        
        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 4000);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            
            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

            try {
                const response = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.access_token) {
                    sessionStorage.setItem('adminToken', data.access_token);
                    sessionStorage.setItem('adminUser', JSON.stringify(data.user));
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    window.location.href = 'admin.html';
                } else {
                    showError(data.error || 'Invalid credentials');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Admin';
                }
            } catch (error) {
                showError('Connection error. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Admin';
            }
        });
    </script>
</body>
</html>
