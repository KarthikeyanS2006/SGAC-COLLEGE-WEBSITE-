<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SGAC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #002347 0%, #1a3a5c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .offline-container {
            text-align: center;
            color: white;
            max-width: 400px;
        }
        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #f9a825;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .retry-btn {
            background: #f9a825;
            color: #002347;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(249, 168, 37, 0.4);
        }
        .cached-info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .cached-info h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #f9a825;
        }
        .cached-info ul {
            list-style: none;
            text-align: left;
            font-size: 13px;
        }
        .cached-info li {
            padding: 5px 0;
            opacity: 0.8;
        }
        .cached-info li::before {
            content: "✓ ";
            color: #f9a825;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>No internet connection detected. Some features may not be available.</p>
        <button class="retry-btn" onclick="window.location.reload()">
            Try Again
        </button>
        
        <div class="cached-info">
            <h3>Available Offline:</h3>
            <ul>
                <li>College information</li>
                <li>Department details</li>
                <li>Faculty profiles</li>
                <li>Contact information</li>
            </ul>
        </div>
    </div>
</body>
</html>
