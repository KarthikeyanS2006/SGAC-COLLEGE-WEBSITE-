<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SGAC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/3ee7079dc6.js" crossorigin="anonymous"></script>
    <style>
        :root { --bg-dark: #0f172a; --bg-card: #1e293b; --accent-blue: #3b82f6; --accent-gold: #fbbf24; --accent-red: #ef4444; --accent-green: #22c55e; --text-main: #f1f5f9; --text-muted: #94a3b8; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; }
        .login-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 440px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .login-logo { width: 72px; height: 72px; background: linear-gradient(135deg, var(--accent-gold), #d97706); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 32px; color: white; }
        .login-box h1 { text-align: center; font-size: 1.5rem; margin-bottom: 4px; }
        .login-box > p { text-align: center; color: var(--text-muted); margin-bottom: 32px; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--text-muted); font-size: 0.875rem; font-weight: 500; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-size: 0.95rem; transition: 0.2s; }
        .form-group input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-blue), #2563eb); border: none; border-radius: 10px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -10px rgba(59,130,246,0.5); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error-msg { background: rgba(239,68,68,0.12); border: 1px solid var(--accent-red); color: #fca5a5; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 0.875rem; display: none; animation: shake 0.3s ease; }
        .error-msg.show { display: block; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
        .back-home { text-align: center; margin-top: 20px; }
        .back-home a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
        .back-home a:hover { color: var(--accent-blue); }
        .footer { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo"><i class="fas fa-shield-alt"></i></div>
        <h1>Admin Login</h1>
        <p>SGAC College Website</p>
        <div id="login-error" class="error-msg"></div>
        <form id="login-form" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="admin@sgac.edu.in" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        <div class="back-home">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
        </div>
        <div class="footer">&copy; 2026 SGAC Admin Panel</div>
    </div>

    <script>
        const API_BASE = '/api';
        
        async function login(email, password) {
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            return res.json();
        }

        function showError(msg) {
            const el = document.getElementById('login-error');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                const data = await login(email, password);
                if (data.error) {
                    showError(data.error);
                } else if (data.access_token) {
                    localStorage.setItem('sgac_token', data.access_token);
                    localStorage.setItem('sgac_user', JSON.stringify(data.user));
                    window.location.href = 'admin.html';
                }
            } catch(err) {
                showError('Connection error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
            return false;
        }

        if (localStorage.getItem('sgac_token')) {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
